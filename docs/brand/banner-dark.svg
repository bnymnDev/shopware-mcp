<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="shopware-mcp: the MCP server for Shopware 6">
  <rect width="1200" height="300" rx="18" fill="#12141a"/>
  <!-- left: a prompt, waiting -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="44" font-weight="700">
    <text x="118" y="166" fill="#62c9ff">›</text>
    <rect x="150" y="130" width="18" height="42" rx="2" fill="#e6e8eb"><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <!-- the question travels through the server to the shop, the answer comes back -->
  <path id="gap-left" d="M 200 150 L 318 150" fill="none"/>
  <path id="gap-right" d="M 882 150 L 1000 150" fill="none"/>
  <line x1="200" y1="150" x2="318" y2="150" stroke="#2b3140" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <line x1="882" y1="150" x2="1000" y2="150" stroke="#2b3140" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle r="5" fill="#62c9ff"><animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0;0.16;1"><mpath href="#gap-left"/></animateMotion><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0;0.16;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#62c9ff"><animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.22;0.38;1"><mpath href="#gap-right"/></animateMotion><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.38;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.5;0.66;1"><mpath href="#gap-right"/></animateMotion><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.66;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.72;0.88;1"><mpath href="#gap-left"/></animateMotion><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.72;0.88;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/></circle>
  <!-- wordmark on a plate so the line passes behind it -->
  <text x="600" y="170" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="96" font-weight="700" letter-spacing="-2" fill="#e6e8eb">shopware<tspan fill="#62c9ff">-mcp</tspan></text>
  <!-- right: the shop -->
  <g transform="translate(1030 108)" fill="none" stroke="#e6e8eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 8 34 L 8 84 L 76 84 L 76 34"/>
    <path d="M 0 34 L 8 8 L 76 8 L 84 34" fill="#62c9ff" fill-opacity="0.18"/>
    <path d="M 0 34 Q 10 46 21 34 Q 31 46 42 34 Q 52 46 63 34 Q 73 46 84 34"/>
    <rect x="30" y="52" width="24" height="32" rx="2"/>
  </g>
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#9aa3ad">the MCP server for Shopware 6: products, orders, stock, audits and reports, safely</text>
</svg>
