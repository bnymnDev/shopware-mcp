<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-label="shopware-mcp setup · a least-privilege integration in one command">
<title>shopware-mcp setup · a least-privilege integration in one command</title>
<rect x="0.5" y="0.5" width="939" height="533" rx="10" fill="#0d1117" stroke="#30363d"/>
<line x1="1" y1="40" x2="939" y2="40" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text x="470" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">shopware-mcp setup · a least-privilege integration in one command</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="24" y="72" opacity="0"><tspan fill="#6e7681">$ </tspan><tspan fill="#e6edf3">npx shopware-mcp setup --url http://127.0.0.1:8000 --user admin --for claude-code</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0449;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="94" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Password for admin: </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0954;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="116" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Role         Created &quot;shopware-mcp (read-only)&quot; with 51 privileges</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1033;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="138" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Integration  Created &quot;shopware-mcp&quot;, not an administrator</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1111;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="160" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Access key   SWIADDVUNKZ2…</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1190;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="182" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Secret       QU15QWlHNUhS…</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1268;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="204" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">             Shown once. Keep it in the host config, not in a repository.</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1347;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="226" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1425;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="248" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Shop         http://127.0.0.1:8000 (Shopware 6.7.13.1)</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1504;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="270" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Verified     28 of 28 read tools ready</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1582;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="292" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  – shop_settings: left out, pass --settings to include it</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1661;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="314" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1740;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="336" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Claude Code</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1818;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="358" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1897;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="380" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">claude mcp add shopware \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1975;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="402" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_URL=http://127.0.0.1:8000 \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2054;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="424" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_CLIENT_ID=SWIADDVUNKZ2… \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2132;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="446" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_CLIENT_SECRET=QU15QWlHNUhS… \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2211;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="468" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -- npx -y shopware-mcp</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2290;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="490" opacity="0"><tspan fill="#6e7681">  </tspan><tspan fill="#6e7681">one admin login, used once and never stored; the role holds exactly what the tools need</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3378;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
<text x="24" y="512" opacity="0"><tspan fill="#58a6ff">› </tspan><tspan fill="#e6edf3">▍<animate attributeName="fill-opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4164;0.9955;1" calcMode="discrete" dur="8.91s" repeatCount="indefinite"/></text>
</g>
</svg>
