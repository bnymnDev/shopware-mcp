<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-label="shopware-mcp setup · a least-privilege integration in one command">
<title>shopware-mcp setup · a least-privilege integration in one command</title>
<rect x="0.5" y="0.5" width="939" height="467" rx="10" fill="#0d1117" stroke="#30363d"/>
<line x1="1" y1="40" x2="939" y2="40" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text x="470" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">shopware-mcp setup · a least-privilege integration in one command</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="24" y="72" opacity="0"><tspan fill="#6e7681">$ </tspan><tspan fill="#e6edf3">npx shopware-mcp setup --url http://127.0.0.1:8000 --user admin --for claude-code</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0460;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="94" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Password for admin: </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0977;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="116" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Shop         http://127.0.0.1:8000 (Shopware 6.7.13.1)</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1057;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="138" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Role         Created &quot;shopware-mcp (read-only)&quot; with 46 privileges</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1138;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="160" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Integration  Created &quot;shopware-mcp&quot;, not an administrator</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1218;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="182" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Verified     29 of 29 read tools ready</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1299;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="204" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1379;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="226" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">The secret is shown once. Keep it in the host config, not in a repository.</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1460;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="248" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1540;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="270" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">Claude Code</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1621;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="292" opacity="0"><tspan fill="#8b949e">  </tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1701;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="314" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">claude mcp add shopware \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1782;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="336" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_URL=http://127.0.0.1:8000 \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1862;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="358" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_CLIENT_ID=SWIAU2C3MHRR… \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1943;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="380" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -e SHOPWARE_CLIENT_SECRET=NzlKSGJHM3lX… \</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2023;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="402" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#8b949e">  -- npx -y shopware-mcp</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2103;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="424" opacity="0"><tspan fill="#6e7681">  </tspan><tspan fill="#6e7681">one admin login, used once and never stored; the role holds exactly what the tools need</tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3218;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
<text x="24" y="446" opacity="0"><tspan fill="#58a6ff">› </tspan><tspan fill="#e6edf3">▍<animate attributeName="fill-opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4023;0.9954;1" calcMode="discrete" dur="8.70s" repeatCount="indefinite"/></text>
</g>
</svg>
