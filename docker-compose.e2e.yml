# Local Shopware for end-to-end tests: `docker compose -f docker-compose.e2e.yml up -d --wait`
services:
  shopware:
    image: dockware/dev:latest
    ports:
      - "8000:80"
    environment:
      SW_API_ACCESS: "true"
      XDEBUG_ENABLED: "0"
    healthcheck:
      # /api/_info/version needs a token and answers 401; the health-check route is public.
      test: ["CMD", "curl", "-fsS", "http://localhost/api/_info/health-check"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
