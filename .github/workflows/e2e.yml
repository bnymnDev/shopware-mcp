name: E2E (dockware)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Shopware (dockware/dev)
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - name: Run e2e tests
        run: pnpm test:e2e
      - name: Shopware logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200
      - name: Stop Shopware
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
