name: Release

on:
  push:
    branches: [main]
  # Lets you start a release deliberately, e.g. right after making the repository public.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    # Never publish a public npm package out of a private repository: the npm page would link to
    # a 404, the release assets would not be downloadable and npm provenance is unavailable.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm release:version
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node points npm at a temp .npmrc that reads NODE_AUTH_TOKEN; changesets reads NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs the package with a verifiable link to this workflow run. Public repos only.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private != true }}
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach the Claude Desktop extension to the release
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm pack:mcpb
          gh release upload "v${{ steps.version.outputs.version }}" shopware-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    # workflow_dispatch also lets this run alone, to repair a partially failed release.
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the image name
        id: image
        # Container repository names must be lowercase, the GitHub owner is not.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}

  mcp-registry:
    needs: release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher authenticates as this repository's owner via OIDC, no local login needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Wait until npm serves the new version
        run: |
          for attempt in $(seq 1 20); do
            if npm view "shopware-mcp@${{ needs.release.outputs.version }}" mcpName >/dev/null 2>&1; then
              echo "npm has ${{ needs.release.outputs.version }}"
              exit 0
            fi
            echo "not on npm yet (attempt $attempt), waiting"
            sleep 15
          done
          echo "npm did not serve the new version in time" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
