name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/demo/*.svg"
      - "docs/brand/*.svg"
      - "docs/video/*.mp4"
      - "docs/video/*.jpg"
      - "docs/video/*.vtt"
      - "docs/brief/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p site/demo site/brand site/video site/brief
          cp docs/demo/*.svg site/demo/
          cp docs/brand/*.svg site/brand/
          cp docs/video/*.mp4 docs/video/*.jpg docs/video/*.vtt site/video/
          cp docs/brief/example.html site/brief/index.html
          cp docs/brief/brief.png site/brief/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
