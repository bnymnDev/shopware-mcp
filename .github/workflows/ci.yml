name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated files are up to date
        run: |
          pnpm docs:tools --check
          pnpm docs:demos --check
          pnpm sync:server --check
      - name: Smoke-test the CLI
        run: |
          node dist/index.js --help
          node dist/bundle/index.js --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Claude Desktop extension
        run: pnpm pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: shopware-mcp-mcpb
          path: shopware-mcp.mcpb
          if-no-files-found: error
